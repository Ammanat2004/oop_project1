<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #547f90, #203a43, #2c4564);
        }
        .logout-container {
            position: absolute;
            top: 20px;
            right: 20px;
        }
        .logout-button {
            background-color: #f44336;
            color: white;
            border: none;
            padding: 10px 10px;
            border-radius: 30px;
            font-size: 16px;
            transition: background-color 0.2s, transform 0.2s;
        }
        .logout-button:hover {
            background-color: red;
            transform: translateY(-2px);
        }
        .profile-container {
            background: #fff;
            width: 90%;
            max-width: 600px;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 6px 10px rgba(0, 0, 0, 0.2);
            text-align: center;
            overflow: hidden;
        }
        .profile-container h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 28px;
        }
        .profile-picture {
            width: 150px;
            height: 150px;
            margin: 0 auto 20px;
            border-radius: 50%;
            border: 4px solid skyblue;
            object-fit: cover;
            object-position: center;
        }
        .profile-info {
            margin: 10px 0;
        }
        .profile-info p {
            font-size: 18px;
            margin: 5px 0;
            color: #555;
        }
        .edit-button {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            border-radius: 30px;
            background-color: #4CAF50;
            color: white;
            font-size: 16px;
            text-decoration: none;
            transition: background-color 0.3s;
        }
        .edit-button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div class="logout-container">
        <nav>
            <a href="index.html">
                <button class="logout-button">ออกจากระบบ</button>
            </a>
        </nav>
    </div>

    <div class="profile-container">
        <h1>ข้อมูลสมาชิก</h1>
        <img class="profile-picture" src="bom.png" alt="Profile Picture">
        <div class="profile-info">
            <p><b>Username:</b> 66011212061</p>
            <p><b>Email:</b> admin@gmail.com</p>
            <p><b>Date of Birth:</b> 01/01/2004</p>
            <p><b>Phone Number:</b> 0987654321</p>
        </div>
        <a href="editing.html" class="edit-button">แก้ไขข้อมูล</a>
    </div>
</body>
</html>
